name: Publish to Reposilite

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Modrinth release type (auto detects it from the core version)
        type: choice
        required: true
        default: auto
        options:
          - auto
          - release
          - beta
          - alpha
  pull_request:
    types: [ closed ]
    branches: [ main ]

permissions:
  contents: read

# A release existence check and its upload must not race another CI run.
concurrency:
  group: publish-reposilite
  cancel-in-progress: false

jobs:
  publish:
    # Only run automatically once a PR is actually merged into `main` (not
    # just closed) - manual runs via workflow_dispatch always execute.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For a merged-PR event, check out the actual commit that landed on
          # `main` instead of the ephemeral PR merge-preview ref (which is all
          # `pull_request` events check out by default).
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & publish to Reposilite
        run: ./gradlew build publish --no-daemon -PskipExistingReleases=true
        env:
          REPOSILITE_URL: ${{ secrets.REPOSILITE_URL }}
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}

      - name: Upload core JAR for Modrinth deployment
        uses: actions/upload-artifact@v4
        with:
          name: modrinth-core
          path: core/build/libs/YVtils_v*.jar
          if-no-files-found: error
          retention-days: 30

  deploy-modrinth:
    name: Deploy core to Modrinth
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      # Secrets cannot be used in a job-level condition. Check them here and
      # skip deployment when Modrinth publishing has not been configured.
      - name: Prepare Modrinth deployment
        id: modrinth
        uses: actions/github-script@v7
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          RELEASE_TYPE: ${{ inputs.release_type || 'auto' }}
        with:
          script: |
            const { MODRINTH_TOKEN: token, MODRINTH_PROJECT_ID: project } = process.env;
            core.setOutput('publish', 'false');
            if (!token || !project) {
              core.notice('Modrinth deployment skipped: configure MODRINTH_TOKEN and MODRINTH_PROJECT_ID secrets.');
              return;
            }

            const fs = require('node:fs');
            const properties = fs.readFileSync('gradle/module-versions.properties', 'utf8');
            const version = properties.match(/^core\s*=\s*(\S+)\s*$/m)?.[1];
            if (!version || !/^\d{2}\.\d{2}\.\d+(?:-(?:alpha|beta|dev|deprecated)\.\d+)?$/.test(version)) {
              throw new Error('Missing or invalid core version in gradle/module-versions.properties');
            }
            const requestedType = process.env.RELEASE_TYPE;
            if (!['auto', 'release', 'beta', 'alpha'].includes(requestedType)) {
              throw new Error(`Invalid Modrinth release type: ${requestedType}`);
            }
            const inferredType = version.includes('-beta.') ? 'beta' : version.includes('-') ? 'alpha' : 'release';
            const type = requestedType === 'auto' ? inferredType : requestedType;
            core.setOutput('version', version);
            core.setOutput('type', type);

            // Core versions can stay unchanged across module-only releases or reruns.
            const response = await fetch(`https://api.modrinth.com/v2/project/${encodeURIComponent(project)}/version`, {
              headers: {
                Authorization: token,
                'User-Agent': `${context.repo.owner}/${context.repo.repo} (GitHub Actions)`
              }
            });
            if (!response.ok) {
              throw new Error(`Cannot check existing Modrinth versions: HTTP ${response.status}`);
            }
            const versions = await response.json();
            if (versions.some(existing => existing.version_number === version)) {
              core.notice(`Modrinth version ${version} already exists; skipping deployment.`);
              return;
            }
            core.setOutput('publish', 'true');

      - name: Download core JAR
        if: steps.modrinth.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: modrinth-core
          path: dist

      - name: Publish core JAR to Modrinth
        if: steps.modrinth.outputs.publish == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/YVtils_v${{ steps.modrinth.outputs.version }}.jar
          name: YVtils ${{ steps.modrinth.outputs.version }}
          version: ${{ steps.modrinth.outputs.version }}
          version-type: ${{ steps.modrinth.outputs.type }}
          changelog: Built from https://github.com/${{ github.repository }}/commit/${{ github.event.pull_request.merge_commit_sha || github.sha }}
          loaders: paper
          environment: server
          # Keep this range aligned with DynamicModuleRegistry.GUI_ARTIFACTS.
          game-versions: |
            26.1.2
            26.2
            26.3
          game-version-filter: releases
          java: '25'
